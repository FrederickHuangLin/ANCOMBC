# Checks of ANCOMBC during development.
#
# check       R CMD check on Linux, macOS, and Windows, with and without the
#             LibTorch library of the package torch.
#               libtorch: true   the ancombc3() examples, tests, and vignette
#                                run, including the extended tests.
#               libtorch: false  the package torch is installed without
#                                LibTorch, as on a machine where
#                                torch::install_torch() was not run; the
#                                ancombc3() examples and tests are skipped and
#                                the vignette shows the stored results.
# bioc-devel  R CMD build, R CMD check, and BiocCheck in the Bioconductor
#             devel container, the configuration of the Bioconductor build
#             machines.
name: check

on:
  push:
    branches: [devel, ancombc3-dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} (LibTorch ${{ matrix.libtorch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        libtorch: [true, false]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      ANCOMBC_EXTENDED_TESTS: ${{ matrix.libtorch }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install LibTorch
        if: matrix.libtorch
        run: torch::install_torch()
        shell: Rscript {0}

      - name: Report torch status
        run: |
          cat("torch package:", requireNamespace("torch", quietly = TRUE), "\n")
          cat("LibTorch:", torch::torch_is_installed(), "\n")
        shell: Rscript {0}

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual")'
          error-on: '"warning"'
          upload-snapshots: false

  bioc-devel:
    name: Bioconductor devel container
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:devel
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          d <- read.dcf("DESCRIPTION")
          fields <- intersect(c("Depends", "Imports", "Suggests"), colnames(d))
          pk <- unlist(strsplit(d[, fields], ","))
          pk <- trimws(sub("\\(.*", "", pk))
          base <- rownames(installed.packages(priority = "base"))
          pk <- setdiff(pk[nzchar(pk)], c("R", base))
          need <- setdiff(c(pk, "BiocCheck"), rownames(installed.packages()))
          BiocManager::install(need, update = FALSE, ask = FALSE)
          missing <- setdiff(c(pk, "BiocCheck"), rownames(installed.packages()))
          if (length(missing) > 0) {
            stop("Not installed: ", paste(missing, collapse = ", "))
          }
        shell: Rscript {0}

      - name: Install LibTorch
        run: torch::install_torch()
        shell: Rscript {0}

      - name: Build
        run: R CMD build .

      - name: Check
        run: R CMD check --no-manual ANCOMBC_*.tar.gz

      - name: BiocCheck
        run: |
          BiocCheck::BiocCheck(list.files(pattern = "^ANCOMBC_.*[.]tar[.]gz$"),
                               `no-check-bioc-help` = TRUE)
        shell: Rscript {0}

      - name: Fail on a check warning or error
        run: |
          log <- readLines("ANCOMBC.Rcheck/00check.log")
          status <- grep("^Status:", log, value = TRUE)
          cat(status, "\n")
          if (any(grepl("ERROR|WARNING", status))) quit(status = 1)
        shell: Rscript {0}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: bioc-devel-check
          path: |
            ANCOMBC.Rcheck/00check.log
            ANCOMBC.Rcheck/00install.out
            ANCOMBC.Rcheck/tests
            ANCOMBC.BiocCheck
